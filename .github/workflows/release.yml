name: release

# Fires after the `test` workflow finishes successfully on master. Reads the
# version from plugin.json; if no `v<version>` release exists yet, builds the
# all-platforms distro and publishes the zips. Idempotent — repeated runs at
# the same version are no-ops.
#
# Manual fallback: workflow_dispatch lets a human re-trigger from the Actions
# tab if a transient failure (e.g. GitHub API blip) needs a retry.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit that produced the green CI run
        uses: actions/checkout@v6
        with:
          # Pinning to head_sha avoids version skew if master advanced
          # between the test workflow finishing and this one starting.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: 'go.mod'

      - name: Read plugin version
        id: version
        run: |
          v=$(jq -r .version plugin.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build cross-platform binaries
        if: steps.check.outputs.skip == 'false'
        run: go run build/make.go --all-platforms

      - name: Package distributables
        if: steps.check.outputs.skip == 'false'
        run: go run build/make.go --all-platforms --distro

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "markdown-report v$VERSION" \
            --notes "Automated release for markdown-report v$VERSION." \
            deploy/markdown-report-*.zip
